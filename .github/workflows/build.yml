name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk GeekPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeekPlay
          path: GeekPlay.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(awk -v v="## ${TAG#v}" '$0 ~ "^"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          gh release create "$TAG" GeekPlay.apk -t "GeekPlay ${TAG}" -n "${NOTES:-Release ${TAG}}"
